# Render 블루프린트: 저장소를 연결하면 이 설정대로 무료 웹 서비스가 만들어진다.
# sync: false 인 값은 Render 화면에서 직접 넣는다 (README의 "배포하기" 참고).
services:
  - type: web
    name: tteongnip-gg
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: SESSION_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: DISCORD_CLIENT_ID
        sync: false
      - key: DISCORD_CLIENT_SECRET
        sync: false
      - key: DISCORD_GUILD_ID
        sync: false
      - key: DISCORD_WEBHOOK_URL
        sync: false
      - key: ADMIN_DISCORD_IDS
        sync: false
